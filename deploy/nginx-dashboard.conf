# 包含于既有HTTPS server内。只公开页面外壳，所有数据仍需控制台访问令牌。
location = /qqbot { return 302 /qqbot/; }
location = /qqbot/api/budget-policy {
    proxy_pass http://127.0.0.1:13100/dashboard/api/budget-policy;
    proxy_set_header Host 127.0.0.1:13100;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    client_max_body_size 8k;
    limit_except GET POST { deny all; }
}
location ^~ /qqbot/ {
    proxy_pass http://127.0.0.1:13100/dashboard/;
    proxy_set_header Host 127.0.0.1:13100;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_buffering off;
    client_max_body_size 1k;
    limit_except GET { deny all; }
}
